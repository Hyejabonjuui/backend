plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hyeja'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv'
	implementation('com.openai:openai-java:4.69.2') {
		exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
	}
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

sourceSets {
	e2eTest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

configurations {
	e2eTestImplementation.extendsFrom implementation, testImplementation
	e2eTestCompileOnly.extendsFrom compileOnly, testCompileOnly
	e2eTestRuntimeOnly.extendsFrom runtimeOnly, testRuntimeOnly
	e2eTestAnnotationProcessor.extendsFrom annotationProcessor, testAnnotationProcessor
}

dependencies {
	e2eTestImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
	e2eTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
	e2eTestImplementation 'org.testcontainers:testcontainers-mariadb'
	e2eTestRuntimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	e2eTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	e2eTestAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('e2eTest', Test) {
	description = 'Runs API E2E tests against MariaDB and Redis Testcontainers.'
	group = 'verification'
	testClassesDirs = sourceSets.e2eTest.output.classesDirs
	classpath = sourceSets.e2eTest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter tasks.named('test')
	systemProperty 'user.timezone', 'Asia/Seoul'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}
