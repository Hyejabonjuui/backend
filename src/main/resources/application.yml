spring:
  application:
    name: hyeja
  config:
    import: "optional:file:./.env[.properties][encoding=utf-8]"
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  sql:
    init:
      mode: ${DB_SEED_MODE:always}
      data-locations:
        - classpath:db/migration/normalize-policy-category.sql
        - classpath:db/migration/normalize-income-range.sql
        - classpath:db/migration/drop-obsolete-policy-columns.sql
        - classpath:db/migration/normalize-policy-condition-enums.sql
        - classpath:db/seed/dev-data.sql
      encoding: UTF-8
      continue-on-error: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    
  ai:
    openai:
      api-key: ${OPEN_AI_KEY}
      chat:
        options:
          model: ${OPEN_AI_MODEL}
  # 로그아웃한 토큰 목록을 저장합니다. 로컬 기본값은 localhost:6379입니다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# 로그인 토큰 서명 키. .env의 JWT_SECRET(32자 이상)을 사용합니다.
jwt:
  secret: ${JWT_SECRET}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    disable-swagger-default-url: true
youth:
  api:
    key: ${YOUTH_API_KEY}
    url: "https://www.youthcenter.go.kr/go/ythip/getPlcy"
