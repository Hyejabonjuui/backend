spring:
  test:
    database:
      # H2 2.4.240의 CHECK 제약 평가 오류를 피하도록 Hikari 연결 풀을 유지합니다.
      # https://github.com/h2database/h2database/issues/4308
      replace: none
  datasource:
    url: jdbc:h2:mem:hyeja-test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: none

# 테스트 전용 서명 키입니다. 실제 서버는 .env의 JWT_SECRET을 사용합니다.
jwt:
  secret: hyeja-test-only-jwt-secret-key-0123456789

# .env에 ADMIN_EMAIL이 있어도 테스트에서는 관리자 계정을 만들지 않습니다(AdminInitializer가 건너뜀).
admin:
  email: ""
  password: ""
